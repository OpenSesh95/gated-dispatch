[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gated-dispatch"
version = "0.1.0"
description = "Approval-gated LLM dispatch with deterministic verification and a cost ledger."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
gated-dispatch = "gated_dispatch.cli:main"

[tool.setuptools]
packages = ["gated_dispatch"]
